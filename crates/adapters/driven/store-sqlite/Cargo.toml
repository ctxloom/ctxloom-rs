[package]
name = "store-sqlite"
version = "0.1.0"
description = "annals' store port on SQLite: one database per project"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
annals.workspace = true
annals-diagnostic.workspace = true
prost.workspace = true
sea-query = "0.32"
sea-query-binder = { version = "0.7", features = ["sqlx-sqlite"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }

[dev-dependencies]
annals = { workspace = true, features = ["contract"] }
fluent-syntax = "0.11"
tokio = { version = "1.54.0", features = ["macros", "rt"] }

[lints]
workspace = true
